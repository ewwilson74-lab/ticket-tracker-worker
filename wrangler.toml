name = "psu-ticket-watch"
main = "src/index.js"
compatibility_date = "2026-08-01"

# Cron Trigger: runs the `scheduled` handler in src/index.js on this schedule.
# Times are UTC. This example fires at 9am, 1pm, and 6pm US Eastern
# (adjust the hours if you want a different cadence — more often as
# gameday approaches is easy to do by adding more entries here).
[triggers]
crons = ["0 13,17,22 * * *"]

# Created with: npx wrangler kv namespace create TICKETS_KV
# Paste the "id" it prints into the line below.
[[kv_namespaces]]
binding = "TICKETS_KV"
id = "98ce71f68f184345b555d93543d2f4d1"

# Secrets (VAPID_SUBJECT, VAPID_PUBLIC_KEY, VAPID_PRIVATE_KEY) are NOT set here —
# see README.md. They're set with `wrangler secret put` so they never end up
# in a file you might commit to GitHub.
